# The box image (runner/box/Dockerfile; docs/virtual-runners.md, "The box
# image"): what a virtual runner's machine boots to run one thread. Built for
# linux/amd64 (Fly's default), checked with runner/box/smoke.sh, then pushed
# to the private registry of the Fly app the boxes live in, as
# registry.fly.io/<app>. It's private because it holds Claude Code, which
# isn't ours to publish (Mike, 19 Nov): Fly pulls it for that app's
# machines with no credentials, and no one else can.
#
# - a push to main that changes what the image holds: `<commit>`, and
#   `latest` once the runner's tests pass on that commit (the `tests` job).
#   New boxes take `latest` (the service's default image, convex/boxes.ts
#   defaultBoxImage), so they run the runner from the main that Mike's
#   backend is deployed from;
# - a release tag (release/YYYY-MM-DD, runner/src/upstream.ts):
#   `<commit>` and `release-YYYY-MM-DD`, for a virtual runner pinned to a
#   release (a release is only tagged on a commit every workflow passed on);
# - by hand (workflow_dispatch): `<commit>`, and `latest` from main, after
#   the tests as for a push.
#
# Until 23 Nov `latest` went out with only the smoke test in front of it,
# so a main whose runner failed its tests still became every new box's
# runner. The tests run here, in this workflow, rather than waiting on
# runner.yml's run: that one has its own paths (a change to only this file
# runs it not at all) and its Windows and Mac jobs, which the box doesn't
# need and which take up to an hour. They're runner.yml's Linux job on
# Node 24 (the box's Node), check.sh's runner typecheck and unit tests, run
# beside the image's build; `latest` waits for both.
#
# The app is the repo variable FLY_BOX_APP (the deployment's FLY_APP), and
# the secret FLY_BOX_IMAGE_TOKEN a Fly token that reaches that app only
# (`fly tokens create deploy -a <app>`, or an org token narrowed with
# `fly tokens attenuate`). Without them (a fork that hasn't set up boxes)
# the image is still built and checked, just not pushed, and the tests
# don't run, as nothing waits on them.
#
# Free, as runner.yml's must be (Mike, 9 Nov): standard hosted runners, no
# schedule, a newer push cancelling the run before it, and only when the
# image's files changed (the paths below: what the Dockerfile copies, the
# image's own files, and this file). Actions pinned as workflow-pins.test.ts
# wants (checkout, and setup-node for the tests); plain docker for the rest.
name: Box image

on:
  push:
    branches: [main]
    # Paths aren't checked for tags: every release tag builds.
    tags: ['release/*']
    paths:
      - 'runner/src/**'
      - 'runner/bin/**'
      - 'runner/package.json'
      - 'runner/package-lock.json'
      - 'runner/.npmrc'
      - 'runner/.dockerignore'
      - 'runner/box/Dockerfile'
      - 'runner/box/entrypoint.sh'
      - 'runner/box/smoke.sh'
      - '.github/workflows/box-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: box-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image: ${{ steps.names.outputs.image }}
      push: ${{ steps.names.outputs.push }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Names and tags
        id: names
        env:
          APP: ${{ vars.FLY_BOX_APP }}
          HAS_TOKEN: ${{ secrets.FLY_BOX_IMAGE_TOKEN != '' }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$APP" ] && [ "$HAS_TOKEN" = true ]; then
            image="registry.fly.io/$APP"; push=true
          else
            image="threadbear-box"; push=false
            echo "::notice::FLY_BOX_APP or FLY_BOX_IMAGE_TOKEN isn't set, so the image is built and checked but not pushed."
          fi
          # `latest` isn't here: the `latest` job adds it once the tests pass.
          tags="$image:$SHA"
          case "$REF" in
            refs/tags/release/*) tags="$tags $image:release-${REF#refs/tags/release/}" ;;
          esac
          {
            echo "image=$image"
            echo "push=$push"
            echo "tags=$tags"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Tags: $tags"

      - name: Sign in to the registry
        if: steps.names.outputs.push == 'true'
        env:
          TOKEN: ${{ secrets.FLY_BOX_IMAGE_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login registry.fly.io -u x --password-stdin

      - name: Build
        # The last `latest` as a cache, when there is one: the Claude Code and
        # packages layers only change when their versions do.
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          SHA: ${{ github.sha }}
          BUILT_AT: ${{ steps.names.outputs.built_at }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build --platform linux/amd64 -f runner/box/Dockerfile \
            --cache-from "$IMAGE:latest" --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg COMMIT="$SHA" --build-arg BUILT_AT="$BUILT_AT" \
            --label org.opencontainers.image.source="$SOURCE" \
            --label org.opencontainers.image.revision="$SHA" \
            --label org.opencontainers.image.description="Threadbear virtual runner box: the runner in box mode and Claude Code" \
            -t "$IMAGE:$SHA" runner
          docker image ls "$IMAGE"

      - name: Smoke test
        run: runner/box/smoke.sh "${{ steps.names.outputs.image }}:${{ github.sha }}"

      - name: Push
        if: steps.names.outputs.push == 'true'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          SHA: ${{ github.sha }}
          TAGS: ${{ steps.names.outputs.tags }}
        run: |
          for tag in $TAGS; do
            [ "$tag" = "$IMAGE:$SHA" ] || docker tag "$IMAGE:$SHA" "$tag"
            docker push "$tag"
          done

  # The runner's typecheck and unit tests, as runner.yml's Linux job on Node 24
  # runs them (its comments say why each step is there). Only where `latest`
  # can be pushed: main, in a repo with the boxes' app set.
  tests:
    if: github.ref == 'refs/heads/main' && vars.FLY_BOX_APP != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runner/package-lock.json

      - name: Image tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q imagemagick librsvg2-bin

      - name: Packages
        run: |
          npm ci --no-audit --no-fund
          (cd runner && npm ci --no-audit --no-fund)

      - name: Runner typecheck and unit tests
        run: THREADBEAR_NODE="$(command -v node)" ./check.sh --runner --local

  # `latest` moves to this commit's image only when it was built, passed the
  # smoke test and was pushed, and the runner's tests passed (a failed or
  # skipped job before it skips this one), and only forward: a re-run of an
  # older main run (its github.sha is still the old commit) would otherwise
  # put the older runner back (Codex's review, 23 Nov). The commit `latest`
  # holds now (its revision label) must be this one or one before it on
  # GitHub's compare; main's runs go one at a time (the concurrency above),
  # so nothing moves it between the check and the push.
  latest:
    needs: [image, tests]
    if: needs.image.outputs.push == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Sign in to the registry
        env:
          TOKEN: ${{ secrets.FLY_BOX_IMAGE_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login registry.fly.io -u x --password-stdin

      - name: Tag it latest
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if docker pull --platform linux/amd64 "$IMAGE:latest"; then
            now=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:latest")
          else
            now=""
            echo "No latest yet."
          fi
          if [ -n "$now" ] && [ "$now" != "$SHA" ]; then
            # How this commit stands against latest's: "ahead" moves it on.
            status=$(gh api "repos/$REPO/compare/$now...$SHA" --jq .status)
            if [ "$status" != ahead ]; then
              echo "::notice::latest is ${now:0:8}, and this commit is $status of it, so latest stays."
              exit 0
            fi
          fi
          docker pull --platform linux/amd64 "$IMAGE:$SHA"
          docker tag "$IMAGE:$SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
